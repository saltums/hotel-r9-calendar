<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOTEL R9 いなべ 予約カレンダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <style>
    /* ─── Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:        #F0F4FA;
      --surface:   #FFFFFF;
      --surface-2: #F6F8FC;
      --hdr:       #0D1E38;
      --hdr-2:     #0F2347;
      --text:      #0D1B2E;
      --text-2:    #4A5568;
      --text-3:    #94A3B8;
      --border:    #DDE3EE;
      --today:     #F59E0B;
      --shadow-sm: 0 1px 3px rgba(13,27,46,.07),0 1px 2px rgba(13,27,46,.04);

      /* Weekday = calm blue (relatively cheap) */
      --wd-bg:   #EFF6FF;
      --wd-txt:  #1E3A5F;
      --wd-num:  #3B82F6;
      --wd-hov:  #DBEAFE;

      /* Weekend / holiday = amber (check price) */
      --we-bg:   #FFFBEB;
      --we-txt:  #78350F;
      --we-num:  #D97706;
      --we-hov:  #FEF3C7;

      /* Sunday / holiday accent */
      --sun-num: #DC2626;
      --sat-num: #2563EB;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:       #0A1525;
        --surface:  #111C2E;
        --surface-2:#0D1729;
        --hdr:      #070E1C;
        --hdr-2:    #091020;
        --text:     #D6E3F8;
        --text-2:   #7E94B4;
        --text-3:   #3D5069;
        --border:   #1A2840;
        --shadow-sm:0 1px 3px rgba(0,0,0,.35);
        --wd-bg:    #0D1829;
        --wd-txt:   #93C5FD;
        --wd-num:   #60A5FA;
        --wd-hov:   #1A2E4A;
        --we-bg:    #1C1505;
        --we-txt:   #FCD34D;
        --we-num:   #F59E0B;
        --we-hov:   #2C1F08;
        --sun-num:  #F87171;
        --sat-num:  #60A5FA;
      }
    }
    :root[data-theme="dark"] {
      --bg:#0A1525; --surface:#111C2E; --surface-2:#0D1729;
      --hdr:#070E1C; --hdr-2:#091020;
      --text:#D6E3F8; --text-2:#7E94B4; --text-3:#3D5069;
      --border:#1A2840; --shadow-sm:0 1px 3px rgba(0,0,0,.35);
      --wd-bg:#0D1829; --wd-txt:#93C5FD; --wd-num:#60A5FA; --wd-hov:#1A2E4A;
      --we-bg:#1C1505; --we-txt:#FCD34D; --we-num:#F59E0B; --we-hov:#2C1F08;
      --sun-num:#F87171; --sat-num:#60A5FA;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Noto Sans JP',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
      background:var(--bg);color:var(--text);min-height:100vh;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    header{background:var(--hdr);color:#fff}
    .hdr-top{max-width:960px;margin:0 auto;padding:22px 20px 18px}
    .eyebrow{
      font-size:.6rem;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;
      color:rgba(255,255,255,.38);margin-bottom:6px
    }
    h1{font-size:1.22rem;font-weight:700;color:rgba(255,255,255,.95);margin-bottom:4px}
    .sub{font-size:.75rem;color:rgba(255,255,255,.45)}

    /* ─── Main ───────────────────────────────────────────────── */
    main{max-width:960px;margin:0 auto;padding:18px 16px 60px}

    /* Legend */
    .legend{
      display:flex;align-items:center;gap:14px;
      margin-bottom:14px;padding:0 2px;flex-wrap:wrap
    }
    .leg{display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--text-2)}
    .swatch{width:28px;height:16px;border-radius:4px;flex-shrink:0}
    .swatch.wd{background:var(--wd-bg);border:1px solid var(--border)}
    .swatch.we{background:var(--we-bg);border:1px solid var(--border)}
    .leg-note{margin-left:auto;font-size:.65rem;color:var(--text-3);text-align:right}

    /* Month card */
    .month-card{
      background:var(--surface);border-radius:14px;
      box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden
    }
    .month-label{
      padding:12px 18px 10px;font-size:.82rem;font-weight:700;
      color:var(--text);border-bottom:1px solid var(--border);letter-spacing:.3px
    }

    /* Grid */
    .cal{display:grid;grid-template-columns:repeat(7,1fr)}
    .dow{
      text-align:center;padding:7px 2px;font-size:.58rem;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;color:var(--text-3);
      border-bottom:1px solid var(--border)
    }
    .dow.s{color:var(--sun-num)} .dow.t{color:var(--sat-num)}

    /* Date cell */
    .dc{
      min-height:62px;padding:8px 8px 5px;
      border-right:1px solid var(--border);border-bottom:1px solid var(--border);
      position:relative;overflow:hidden;transition:filter .1s;
      text-decoration:none;display:block;
    }
    .dc:nth-child(7n){border-right:none}
    .dc.empty{background:var(--surface-2);pointer-events:none}
    .dc.past{opacity:.25;pointer-events:none}
    .dc.is-today{box-shadow:inset 0 0 0 2px var(--today)}

    .dc.wd{background:var(--wd-bg)}
    .dc.wd:hover{background:var(--wd-hov)}
    .dc.we{background:var(--we-bg)}
    .dc.we:hover{background:var(--we-hov)}

    .dc-num{
      display:block;font-size:.72rem;font-weight:600;margin-bottom:5px
    }
    .dc.wd .dc-num{color:var(--wd-num)}
    .dc.we .dc-num{color:var(--we-num)}
    .dc.is-sun .dc-num{color:var(--sun-num)}
    .dc.is-sat .dc-num{color:var(--sat-num)}

    .dc-label{
      display:block;font-size:.62rem;font-weight:500;line-height:1.3;
      color:var(--text-2);
    }
    .dc.we .dc-label{color:var(--we-txt);opacity:.85}
    .dc.wd .dc-label{color:var(--wd-txt);opacity:.75}

    .dc-hol{
      display:block;font-size:.58rem;font-weight:500;
      color:var(--sun-num);opacity:.85;margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%
    }

    @media(max-width:500px){
      .dc{min-height:50px;padding:6px 5px 4px}
      .dc-num{font-size:.66rem;margin-bottom:3px}
      .dc-label{font-size:.56rem}
      .dc-hol{display:none}
      h1{font-size:1rem}
      .leg-note{display:none}
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-top">
    <div class="eyebrow">Agoda 予約カレンダー</div>
    <h1>HOTEL R9 The Yard いなべ</h1>
    <div class="sub">日付をクリックするとAgodaの予約ページが開きます</div>
  </div>
</header>

<main>
  <div class="legend">
    <div class="leg"><span class="swatch wd"></span>平日（比較的安め）</div>
    <div class="leg"><span class="swatch we"></span>土日・祝（要確認）</div>
    <span class="leg-note">クリック → Agodaでリアルタイム価格確認・予約</span>
  </div>
  <div id="cal"></div>
</main>

<script>
/* ── Config ─────────────────────────────────────────────── */
const AGODA_BASE = 'https://www.agoda.com/ja-jp/hotel-r9-the-yard-inabe-h31033908/hotel/yokkaichi-jp.html';
const MONTHS     = 3;
const DOWS       = ['日','月','火','水','木','金','土'];

/* ── 日本の祝日 2026-2027 ─────────────────────────────── */
const HOLIDAYS = {
  '2026-01-01': '元日',
  '2026-01-12': '成人の日',
  '2026-02-11': '建国記念の日',
  '2026-02-23': '天皇誕生日',
  '2026-03-20': '春分の日',
  '2026-04-29': '昭和の日',
  '2026-05-03': '憲法記念日',
  '2026-05-04': 'みどりの日',
  '2026-05-05': 'こどもの日',
  '2026-07-20': '海の日',
  '2026-08-11': '山の日',
  '2026-09-21': '敬老の日',
  '2026-09-22': '振替休日',
  '2026-09-23': '秋分の日',
  '2026-10-12': 'スポーツの日',
  '2026-11-03': '文化の日',
  '2026-11-23': '勤労感謝の日',
  '2026-12-23': '天皇誕生日振替',
  '2027-01-01': '元日',
  '2027-01-11': '成人の日',
  '2027-02-11': '建国記念の日',
  '2027-02-23': '天皇誕生日',
  '2027-03-21': '春分の日',
  '2027-04-29': '昭和の日',
  '2027-05-03': '憲法記念日',
  '2027-05-04': 'みどりの日',
  '2027-05-05': 'こどもの日',
};

/* ── Helpers ──────────────────────────────────────────── */
const pad = n => String(n).padStart(2,'0');
const ds = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;

function todayStr(){
  const t = new Date();
  return ds(t.getFullYear(), t.getMonth(), t.getDate());
}

function agodaUrl(dateStr){
  const d  = new Date(dateStr + 'T00:00:00');
  const nx = new Date(d);
  nx.setDate(nx.getDate() + 1);
  const fmt = x => `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;
  return `${AGODA_BASE}?checkIn=${fmt(d)}&checkOut=${fmt(nx)}&adults=1`;
}

/* ── Calendar ─────────────────────────────────────────── */
function renderCal(){
  const today = todayStr();
  const now   = new Date();
  const parts = [];

  for(let mo = 0; mo < MONTHS; mo++){
    const year  = now.getFullYear() + Math.floor((now.getMonth() + mo) / 12);
    const month = (now.getMonth() + mo) % 12;
    const first = new Date(year, month, 1);
    const last  = new Date(year, month + 1, 0).getDate();
    const fdow  = first.getDay();

    parts.push(
      `<div class="month-card">`,
      `<div class="month-label">${year}年 ${month+1}月</div>`,
      `<div class="cal">`
    );

    DOWS.forEach((dw, i) => {
      const cls = i === 0 ? ' s' : i === 6 ? ' t' : '';
      parts.push(`<div class="dow${cls}">${dw}</div>`);
    });

    for(let i = 0; i < fdow; i++)
      parts.push(`<div class="dc empty"></div>`);

    for(let d = 1; d <= last; d++){
      const dateS  = ds(year, month, d);
      const dow    = (fdow + d - 1) % 7;
      const isSun  = dow === 0;
      const isSat  = dow === 6;
      const hol    = HOLIDAYS[dateS];
      const isWe   = isSun || isSat || !!hol;
      const past   = dateS < today;
      const isToday= dateS === today;

      const typeCls  = isWe ? 'we' : 'wd';
      const sunCls   = isSun ? ' is-sun' : '';
      const satCls   = isSat ? ' is-sat' : '';
      const todayCls = isToday ? ' is-today' : '';
      const pastCls  = past ? ' past' : '';

      const href  = !past ? agodaUrl(dateS) : '#';
      const label = isWe ? (hol || (isSun ? '日曜' : '土曜')) : 'Agodaで確認';

      parts.push(
        `<a class="dc ${typeCls}${sunCls}${satCls}${todayCls}${pastCls}" `,
        past ? '' : `href="${href}" target="_blank" rel="noopener" title="${dateS} Agodaで予約"`,
        `>`,
        `<span class="dc-num">${d}</span>`,
        `<span class="dc-label">${label}</span>`,
        hol ? `<span class="dc-hol">${hol}</span>` : '',
        `</a>`
      );
    }

    const total = fdow + last;
    const trail = (7 - total % 7) % 7;
    for(let i = 0; i < trail; i++)
      parts.push(`<div class="dc empty"></div>`);

    parts.push('</div></div>');
  }

  document.getElementById('cal').innerHTML = parts.join('');
}

renderCal();
</script>
</body>
</html>
