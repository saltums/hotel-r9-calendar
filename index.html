<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOTEL R9 いなべ 料金カレンダー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
  <style>
    :root {
      --bg:        #EEF2F8;
      --surface:   #FFFFFF;
      --surface-2: #F6F8FC;
      --hdr:       #0D1E38;
      --hdr-2:     #0F2347;
      --text:      #0D1B2E;
      --text-2:    #4A5568;
      --text-3:    #94A3B8;
      --border:    #DDE3EE;
      --today:     #F59E0B;
      --sun:       #DC2626;
      --sat:       #2563EB;
      --shadow-sm: 0 1px 3px rgba(13,27,46,.07),0 1px 2px rgba(13,27,46,.04);

      --cheap-bg:  #1D4ED8;
      --cheap-hov: #1E40AF;
      --cheap-txt: #FFFFFF;
      --cheap-num: rgba(255,255,255,.68);
      --cheap-src: rgba(255,255,255,.55);

      --exp-bg:    #F1F5F9;
      --exp-txt:   #94A3B8;
      --exp-num:   #CBD5E0;

      --none-bg:   #FFFFFF;
      --none-num:  #94A3B8;
      --none-txt:  #CBD5E0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#0A1525; --surface:#111C2E; --surface-2:#0D1729;
        --hdr:#070E1C; --hdr-2:#091020;
        --text:#D6E3F8; --text-2:#7E94B4; --text-3:#3D5069;
        --border:#1A2840; --sun:#F87171; --sat:#60A5FA;
        --shadow-sm:0 1px 3px rgba(0,0,0,.35);
        --cheap-bg:#2563EB; --cheap-hov:#1D4ED8;
        --cheap-txt:#FFF; --cheap-num:rgba(255,255,255,.6); --cheap-src:rgba(255,255,255,.45);
        --exp-bg:#0D1520; --exp-txt:#2D3E56; --exp-num:#1E2D40;
        --none-bg:#111C2E; --none-num:#2D3E56; --none-txt:#1E2D40;
      }
    }
    :root[data-theme="dark"] {
      --bg:#0A1525; --surface:#111C2E; --surface-2:#0D1729;
      --hdr:#070E1C; --hdr-2:#091020;
      --text:#D6E3F8; --text-2:#7E94B4; --text-3:#3D5069;
      --border:#1A2840; --sun:#F87171; --sat:#60A5FA;
      --shadow-sm:0 1px 3px rgba(0,0,0,.35);
      --cheap-bg:#2563EB; --cheap-hov:#1D4ED8;
      --cheap-txt:#FFF; --cheap-num:rgba(255,255,255,.6); --cheap-src:rgba(255,255,255,.45);
      --exp-bg:#0D1520; --exp-txt:#2D3E56; --exp-num:#1E2D40;
      --none-bg:#111C2E; --none-num:#2D3E56; --none-txt:#1E2D40;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans JP',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

    header{background:var(--hdr);color:#fff}
    .hdr-top{max-width:960px;margin:0 auto;padding:22px 20px 16px}
    .eyebrow{font-size:.62rem;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.38);margin-bottom:6px}
    h1{font-size:1.2rem;font-weight:700;color:rgba(255,255,255,.95)}

    .stats-strip{background:var(--hdr-2);border-top:1px solid rgba(255,255,255,.06)}
    .stats-inner{max-width:960px;margin:0 auto;padding:11px 20px 15px;display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
    .stat{display:flex;flex-direction:column;gap:3px;padding-right:22px;margin-right:22px;border-right:1px solid rgba(255,255,255,.08)}
    .stat:last-of-type{border-right:none;margin-right:0;padding-right:0}
    .stat-label{font-size:.6rem;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.35)}
    .stat-val{font-size:.98rem;font-weight:700;color:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}
    .stat-val.accent{color:#60A5FA}
    .upd{margin-left:auto;font-size:.65rem;color:rgba(255,255,255,.40);align-self:flex-end;padding-bottom:1px}

    main{max-width:960px;margin:0 auto;padding:18px 16px 60px}

    .legend{display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:0 2px;flex-wrap:wrap}
    .leg{display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--text-2)}
    .swatch{width:28px;height:16px;border-radius:4px;flex-shrink:0}
    .swatch.c{background:var(--cheap-bg)}
    .swatch.e{background:var(--exp-bg);border:1px solid var(--border)}
    .swatch.n{background:var(--none-bg);border:1px dashed var(--border)}
    .leg-note{margin-left:auto;font-size:.66rem;color:var(--text-3)}

    .notice{background:#FEF3C7;color:#92400E;border-radius:10px;padding:12px 16px;font-size:.8rem;margin-bottom:14px;line-height:1.6;display:none}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .notice{background:#1C1A05;color:#D97706}}
    :root[data-theme="dark"] .notice{background:#1C1A05;color:#D97706}

    .month-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
    .month-label{padding:12px 18px 10px;font-size:.82rem;font-weight:700;color:var(--text);border-bottom:1px solid var(--border);letter-spacing:.3px}

    .cal{display:grid;grid-template-columns:repeat(4,1fr)}
    .dow{text-align:center;padding:7px 2px;font-size:.58rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--border)}

    .dc{min-height:70px;padding:8px 8px 5px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:filter .12s;position:relative;overflow:hidden;text-decoration:none;display:block;cursor:pointer}
    .dc:nth-child(4n){border-right:none}
    .dc.empty{background:var(--surface-2);pointer-events:none;cursor:default}
    .dc.past{opacity:.28;pointer-events:none;cursor:default}
    .dc.is-today{box-shadow:inset 0 0 0 2px var(--today)}

    .dc.cheap{background:var(--cheap-bg)}
    .dc.cheap:hover{background:var(--cheap-hov)}
    .dc.exp{background:var(--exp-bg)}
    .dc.exp:hover{filter:brightness(.96)}
    .dc.none{background:var(--none-bg)}
    .dc.none:hover{filter:brightness(.97)}

    .dc-num{display:block;font-size:.7rem;font-weight:500;margin-bottom:4px}
    .dc.cheap .dc-num{color:var(--cheap-num)}
    .dc.exp   .dc-num{color:var(--exp-num)}
    .dc.none  .dc-num{color:var(--none-num)}


    .dc-price{display:block;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;margin-bottom:3px}
    .dc.cheap .dc-price{color:var(--cheap-txt)}
    .dc.exp   .dc-price{color:var(--exp-txt)}
    .dc.none  .dc-price{color:var(--none-txt);font-size:.7rem;font-weight:400}

    .dc-src{display:block;font-size:.58rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .dc.cheap .dc-src{color:var(--cheap-src)}
    .dc.exp   .dc-src{color:rgba(148,163,184,.6)}

    .dc-prev{display:block;font-size:.56rem;font-variant-numeric:tabular-nums;margin-top:2px;opacity:.7}
    .dc.cheap .dc-prev{color:var(--cheap-num)}
    .dc.exp   .dc-prev{color:var(--exp-txt)}
    .dc-prev .up{color:#F87171}
    .dc-prev .dn{color:#34D399}

    .loader{text-align:center;padding:56px 16px;color:var(--text-2)}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:#2563EB;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:500px){
      .dc{min-height:54px;padding:6px 5px 4px}
      .dc-num{font-size:.65rem} .dc-price{font-size:.78rem}
      h1{font-size:1rem}
      .stat{padding-right:14px;margin-right:14px}
      .stat-val{font-size:.88rem}
      .leg-note{display:none}
    }
  </style>
</head>
<body>

<header>
  <div class="hdr-top">
    <div class="eyebrow">Trivago 最安値カレンダー（月〜木）</div>
    <h1>HOTEL R9 The Yard いなべ</h1>
  </div>
  <div class="stats-strip">
    <div class="stats-inner">
      <div class="stat">
        <span class="stat-label">直近の最安値</span>
        <span class="stat-val accent" id="sCheapest">読込中…</span>
      </div>
      <div class="stat">
        <span class="stat-label">今後の平均</span>
        <span class="stat-val" id="sAvg">—</span>
      </div>
      <div class="stat">
        <span class="stat-label">格安日数</span>
        <span class="stat-val" id="sCount">—</span>
      </div>
      <span class="upd" id="sUpd">—</span>
      <span class="upd" id="sNext" style="margin-left:10px">—</span>
    </div>
  </div>
</header>

<main>
  <div class="legend">
    <div class="leg"><span class="swatch c"></span>格安 ¥6,500以下</div>
    <div class="leg"><span class="swatch e"></span>¥6,500超</div>
    <div class="leg"><span class="swatch n"></span>データなし</div>
    <span class="leg-note">月〜木のみ表示 / クリック → Trivagoで比較・予約</span>
  </div>
  <div id="notice" class="notice"></div>
  <div id="cal">
    <div class="loader"><div class="spinner"></div>料金データを読み込み中…</div>
  </div>
</main>

<script>
const CHEAP_MAX  = 6500;
const MONTHS     = 3;
const DOWS       = ['日','月','火','水','木','金','土']; // fmtJP用
const WEEKDAY_DOW = [1,2,3,4]; // 月=1,火=2,水=3,木=4  (金土日を除外)
const DOW_LABELS = ['月','火','水','木'];
const pad = n => String(n).padStart(2,'0');
const ds  = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const isWeekday = dateStr => {
  const dow = new Date(dateStr + 'T00:00:00').getDay();
  return WEEKDAY_DOW.includes(dow);
};

function todayStr(){
  const t=new Date();
  return ds(t.getFullYear(),t.getMonth(),t.getDate());
}

function fmtJP(str){
  const[y,m,d]=str.split('-');
  const w=DOWS[new Date(str+'T00:00:00').getDay()];
  return `${parseInt(m)}月${parseInt(d)}日（${w}）`;
}

function parseEntry(raw){
  if(raw==null) return {price:null,url:null,source:null};
  if(typeof raw==='number') return {price:raw,url:null,source:null};
  return {price:raw.price??null, url:raw.cheapestUrl??null, source:raw.cheapestSource??null};
}

function updateStats(prices, lastUpdated){
  const today=todayStr();
  const fp=Object.entries(prices)
    .map(([d,v])=>({d,...parseEntry(v)}))
    .filter(x=>x.d>=today&&x.price>0&&isWeekday(x.d))
    .sort((a,b)=>a.d.localeCompare(b.d));
  if(fp.length>0){
    const min=fp.reduce((a,b)=>a.price<b.price?a:b);
    const avg=Math.round(fp.reduce((s,x)=>s+x.price,0)/fp.length);
    const cheap=fp.filter(x=>x.price<=CHEAP_MAX).length;
    document.getElementById('sCheapest').textContent=`¥${min.price.toLocaleString()} (${fmtJP(min.d)})`;
    document.getElementById('sAvg').textContent=`¥${avg.toLocaleString()}`;
    document.getElementById('sCount').textContent=`${cheap}日`;
  } else {
    document.getElementById('sCheapest').textContent='データなし';
  }
  if(lastUpdated){
    const d=new Date(lastUpdated);
    // UTC → JST (+9h)
    const jst=new Date(d.getTime()+9*60*60*1000);
    const mo=jst.getUTCMonth()+1, dy=jst.getUTCDate();
    const hh=String(jst.getUTCHours()).padStart(2,'0'), mm=String(jst.getUTCMinutes()).padStart(2,'0');
    const diff=Math.floor((Date.now()-d)/60000);
    const rel=diff<60?`${diff}分前`:diff<1440?`${Math.floor(diff/60)}時間前`:`${Math.floor(diff/1440)}日前`;
    document.getElementById('sUpd').textContent=`最終更新 ${mo}/${dy} ${hh}:${mm} (${rel})`;
  }
  // 次の更新 = 毎時00分なので、次の :00 を計算
  const now2=new Date(); const jstNow=new Date(now2.getTime()+9*60*60*1000);
  const nextJst=new Date(jstNow); nextJst.setUTCMinutes(0,0,0); nextJst.setUTCHours(nextJst.getUTCHours()+1);
  const nm=String(nextJst.getUTCMonth()+1), nd=String(nextJst.getUTCDate());
  const nh=String(nextJst.getUTCHours()).padStart(2,'0');
  document.getElementById('sNext').textContent=`次の更新 ${nm}/${nd} ${nh}:00`;
}

function renderCal(prices, prevPrices){
  prevPrices=prevPrices||{};
  const today=todayStr();
  const now=new Date();
  const parts=[];

  for(let mo=0;mo<MONTHS;mo++){
    const year =now.getFullYear()+Math.floor((now.getMonth()+mo)/12);
    const month=(now.getMonth()+mo)%12;
    const first=new Date(year,month,1);
    const last =new Date(year,month+1,0).getDate();
    const fdow =first.getDay(); // 0=日..6=土

    parts.push(`<div class="month-card">`,`<div class="month-label">${year}年 ${month+1}月</div>`,`<div class="cal">`);
    DOW_LABELS.forEach(dw=>parts.push(`<div class="dow">${dw}</div>`));

    // 月列(1)を0番目として、先頭の空セル数を計算
    // fdowが月(1)→0個, 火(2)→1個, 水(3)→2個, 木(4)→3個
    // 金土日→その週の月曜は次週なので0個
    const emptyBefore = (fdow>=1&&fdow<=4) ? fdow-1 : 0;
    for(let i=0;i<emptyBefore;i++) parts.push(`<div class="dc empty"></div>`);

    let cellCount=emptyBefore;
    for(let d=1;d<=last;d++){
      const dateS=ds(year,month,d);
      const dow=(fdow+d-1)%7;
      if(!WEEKDAY_DOW.includes(dow)) continue; // 金土日スキップ

      const past=dateS<today;
      const isToday=dateS===today;
      const raw=prices[dateS];
      const {price,url,source}=parseEntry(raw);

      const state=price==null?'none':price<=CHEAP_MAX?'cheap':'exp';
      const href=url||'#';
      const onClick=!past?` href="${href}" target="_blank" rel="noopener"`:' ';

      const priceHtml=price!=null
        ?`<span class="dc-price">¥${price.toLocaleString()}</span>`
        :`<span class="dc-price">—</span>`;
      const srcHtml=source&&!past?`<span class="dc-src">${source}</span>`:'';
      const prev=parseEntry(prevPrices[dateS]);
      let prevHtml='';
      if(!past&&price!=null&&prev.price!=null&&prev.price!==price){
        const diff=price-prev.price;
        const cls=diff>0?'up':'dn', arrow=diff>0?'↑':'↓';
        prevHtml=`<span class="dc-prev"><span class="${cls}">${arrow}¥${Math.abs(diff).toLocaleString()}</span> 前¥${prev.price.toLocaleString()}</span>`;
      }

      parts.push(
        `<a class="dc ${state}${isToday?' is-today':''}${past?' past':''}"${onClick}>`,
        `<span class="dc-num">${d}</span>`,
        priceHtml, srcHtml, prevHtml,
        `</a>`
      );
      cellCount++;
    }

    const trail=(4-cellCount%4)%4;
    for(let i=0;i<trail;i++) parts.push(`<div class="dc empty"></div>`);
    parts.push('</div></div>');
  }
  document.getElementById('cal').innerHTML=parts.join('');
}

async function init(){
  let data={prices:{},lastUpdated:null};
  let prevPrices={};
  let hasData=false;
  const ts='?_='+Date.now();
  try{
    const [r1,r2]=await Promise.allSettled([
      fetch('./prices.json'+ts).then(r=>r.ok?r.json():Promise.reject()),
      fetch('./prices_prev.json'+ts).then(r=>r.ok?r.json():Promise.reject()),
    ]);
    if(r1.status==='fulfilled'){ data=r1.value; hasData=Object.values(data.prices||{}).some(v=>parseEntry(v).price!=null); }
    if(r2.status==='fulfilled'){ prevPrices=r2.value.prices||{}; }
  }catch(e){}

  try{ updateStats(data.prices||{},data.lastUpdated); }catch(e){ console.error('updateStats',e); }
  try{ renderCal(data.prices||{},prevPrices); }catch(e){ console.error('renderCal',e); }

  if(!hasData){
    const n=document.getElementById('notice');
    n.style.display='block';
    n.textContent='⚠ 料金データが未取得です。run_and_push.ps1 を実行して価格を更新してください。';
  }
  setTimeout(()=>location.reload(),30*60*1000);
}
init();
</script>
</body>
</html>
